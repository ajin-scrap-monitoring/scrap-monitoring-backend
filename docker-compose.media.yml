# Optional authenticated byte path; FastAPI remains JSON/SDP only.
services:
  media-gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    user: "101:101"
    read_only: true
    ports:
      - "127.0.0.1:${MEDIA_PROXY_PORT:-8080}:8080"
    environment:
      MEDIA_PROXY_UPSTREAM: ${MEDIA_PROXY_UPSTREAM:?Set the media service host and port}
      MEDIA_API_TOKEN: ${MEDIA_API_TOKEN:?Set the media service token}
      NGINX_ENVSUBST_FILTER: ^(MEDIA_PROXY_UPSTREAM|MEDIA_API_TOKEN)$$
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
    volumes:
      - ./deploy/media-gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/media-gateway-nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
    depends_on:
      backend:
        condition: service_healthy
