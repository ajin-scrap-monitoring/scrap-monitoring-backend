# Overlay for docker-compose.postgresql.yml. Backup storage must be prepared explicitly.
services:
  backup:
    image: ${POSTGRES_IMAGE:?Set the reviewed PostgreSQL 17 image}
    profiles: [backup]
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: scrap_monitoring
      PGUSER: scrap_backup
      PGPASSWORD: ${DB_BACKUP_PASSWORD:?Supply the backup login password privately}
      PGCONNECT_TIMEOUT: "10"
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETAIN_COUNT: ${BACKUP_RETAIN_COUNT:-7}
      BACKUP_TIMEOUT_SECONDS: ${BACKUP_TIMEOUT_SECONDS:-300}
    entrypoint: [bash, /opt/scrap-backup/entrypoint.sh]
    command: [loop]
    volumes:
      - backup_data:/backups
      - ./deploy/backup:/opt/scrap-backup:ro
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, bash, /opt/scrap-backup/worker.sh, health]
      interval: 30s
      timeout: 3s
      retries: 1
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backup_data:
    external: true
    name: ${POSTGRES_BACKUP_VOLUME:?Set a separately prepared backup volume}
