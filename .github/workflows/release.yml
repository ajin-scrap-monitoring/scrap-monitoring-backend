name: Release image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Verify and publish backend image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      packages: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Verify tag and source identity
        id: release
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          python3 scripts/release.py verify-tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"

      - name: Require successful main CI and an unpublished version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          passed=$(gh run list --workflow ci.yml --branch main --commit "$COMMIT" \
            --json status,conclusion --jq '.[0] | .status == "completed" and .conclusion == "success"')
          test "$passed" = true
          response=$(mktemp "$RUNNER_TEMP/release-lookup.XXXXXXXX")
          if gh api --include "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" > "$response" 2>/dev/null; then
            echo "An existing Release must not be overwritten." >&2
            exit 1
          fi
          head -n 1 "$response" | grep -Eq '^HTTP/[0-9.]+ 404' || {
            echo "Release lookup failed; publication stopped." >&2
            exit 1
          }

      - name: Install locked validation dependencies
        run: uv sync --frozen

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build release image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: |
            ghcr.io/ajin-scrap-monitoring/scrap-monitoring-backend:${{ steps.release.outputs.version }}
            ghcr.io/ajin-scrap-monitoring/scrap-monitoring-backend:sha-${{ steps.release.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/ajin-scrap-monitoring/scrap-monitoring-backend
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify isolated runtime and dependency notices
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          uv run python -m scripts.verify_release_image \
            "ghcr.io/ajin-scrap-monitoring/scrap-monitoring-backend:$VERSION" "$COMMIT" "$VERSION" \
            --audit "$RUNNER_TEMP/runtime-dependencies.json"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the verified image and resolve its digest
        id: publish
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/ajin-scrap-monitoring/scrap-monitoring-backend
          docker push "$image:$VERSION"
          docker push "$image:sha-$COMMIT"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:$VERSION")
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "Image: $reference" >> "$GITHUB_STEP_SUMMARY"

      - name: Require public image access
        env:
          IMAGE_REFERENCE: ${{ steps.publish.outputs.reference }}
        shell: bash
        run: |
          set -euo pipefail
          anonymous_config=$(mktemp -d "$RUNNER_TEMP/anonymous-docker.XXXXXXXX")
          if ! DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$IMAGE_REFERENCE" >/dev/null; then
            echo "::error::The GHCR package must be Public. Configure first-publish package visibility, then rerun. No GitHub Release has been published."
            exit 1
          fi

      - name: Prepare public assets and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMAGE_REFERENCE: ${{ steps.publish.outputs.reference }}
          COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          assets=$(mktemp -d "$RUNNER_TEMP/backend-release.XXXXXXXX")
          uv run python -m scripts.release assets "$assets" "$IMAGE_REFERENCE" \
            --audit "$RUNNER_TEMP/runtime-dependencies.json"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Source: $COMMIT. Image: $IMAGE_REFERENCE. 설정 명세와 공개 예시, 실행·migration 안내 및 의존성 고지를 제공한다." \
            "$assets/env.example" "$assets/CONFIGURATION.md" "$assets/RELEASING.md" \
            "$assets/settings.schema.json" "$assets/image-reference.txt" \
            "$assets/runtime-dependencies.json" "$assets/SHA256SUMS"
          downloaded=$(mktemp -d "$RUNNER_TEMP/backend-release-download.XXXXXXXX")
          gh release download "$GITHUB_REF_NAME" --dir "$downloaded"
          (cd "$downloaded" && sha256sum --strict --check SHA256SUMS)
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
